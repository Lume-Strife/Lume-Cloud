<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 100 125" fill="none" aria-label="Lume">
  <!-- Small-size version of the Lume bulb: smooth feathered edge and a tight halo, no noise. -->
  <defs>
    <radialGradient id="halo" cx="50" cy="49" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#FFC94D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFC94D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="on" cx="0.44" cy="0.36" r="0.72">
      <stop offset="0" stop-color="#FFF6CF"/>
      <stop offset="0.3" stop-color="#FFD86B"/>
      <stop offset="0.68" stop-color="#FFB02E"/>
      <stop offset="1" stop-color="#F59A1C"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" x2="1">
      <stop offset="0" stop-color="#9A9286"/>
      <stop offset="0.45" stop-color="#E2DDD5"/>
      <stop offset="1" stop-color="#9A9286"/>
    </linearGradient>
    <filter id="feather" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <circle cx="50" cy="49" r="50" fill="url(#halo)"/>
  <rect x="36" y="95" width="28" height="9" rx="4.5" fill="url(#cap)"/>
  <rect x="37.5" y="103" width="25" height="8" rx="4" fill="url(#cap)"/>
  <rect x="39.5" y="110" width="21" height="7" rx="3.5" fill="url(#cap)"/>
  <rect x="44" y="116" width="12" height="6" rx="3" fill="#9A9286"/>
  <path d="M50 11 C71 11 88 28 88 49 C88 63 81 73 72 81 C67 85.5 64 89.5 63.5 97 L36.5 97 C36 89.5 33 85.5 28 81 C19 73 12 63 12 49 C12 28 29 11 50 11 Z" fill="url(#on)" filter="url(#feather)"/>
  <ellipse cx="50" cy="56" rx="17" ry="15" fill="#FFF8DC" opacity="0.5" filter="url(#haze)"/>
  <ellipse cx="36" cy="31" rx="9" ry="5.5" transform="rotate(-35 36 31)" fill="#FFFFFF" opacity="0.55" filter="url(#haze)"/>
</svg>
